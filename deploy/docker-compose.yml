# UNSWEEP relayer (Base mainnet 8453, #737 4a-fix3, #85=A,X). SIN 'ports': solo alcanzable en la red docker por el nombre unsweep-relayer:8787 (Caddy).
name: unsweep
services:
  relayer:
    build: ../relayer
    container_name: unsweep-relayer
    restart: always
    user: "1000:1000"
    # #89: env MINIMO (TURNSTILE_*, OPS_PK, BASE_RPC_URL, ETH_RPC_URL) generado por tools/gen_env_min.py, 600, fuera del repo
    env_file: /opt/aire/unsweep-relayer.env
    environment:
      UNSWEEP_CHAIN_ID: "8453"
      # deployments/mainnet.txt (blob 21863f98): contratos CREATE2 verificados en Basescan
      UNSWEEP_DELEGATE: "0x38bcF425bC4d13624734e09376F2fafc799fA8c8"
      UNSWEEP_CONFIG: "0x56a345661e3999F2b20f1E069aAC14097Fa0D118"
      # RPC publico oficial de Base (sin secretos en el repo)
      UNSWEEP_RPC: "https://mainnet.base.org"
      # Turnstile: claves reales desde env_file minimo (/opt/aire/unsweep-relayer.env); sin overrides de TEST (svc_core las rechaza en mainnet)
      UNSWEEP_PG: "host=/var/run/postgresql dbname=unsweep user=tecnoclic"
    volumes:
      - ..:/app:ro
      - ../relayer/data:/app/relayer/data
      - /var/run/postgresql:/var/run/postgresql
    expose: ["8787"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      x402:
        aliases: [unsweep-relayer]
  relayer-arb:
    # #125=A (#1011 F v12): Arbitrum One 42161, mismos topes #1011/#1012 (ops_guard 0.005 ETH fail-closed). Sin 'ports'.
    build: ../relayer
    container_name: unsweep-relayer-arb
    restart: always
    user: "1000:1000"
    env_file: /opt/aire/unsweep-relayer.env
    environment:
      UNSWEEP_CHAIN_ID: "42161"
      # deployments/mainnet.txt: CREATE2, misma direccion en Base y Arbitrum One (verificado en Arbiscan)
      UNSWEEP_DELEGATE: "0x38bcF425bC4d13624734e09376F2fafc799fA8c8"
      UNSWEEP_CONFIG: "0x56a345661e3999F2b20f1E069aAC14097Fa0D118"
      # RPC publico oficial de Arbitrum One (sin secretos en el repo)
      UNSWEEP_RPC: "https://arb1.arbitrum.io/rpc"
      UNSWEEP_PG: "host=/var/run/postgresql dbname=unsweep user=tecnoclic"
    volumes:
      - ..:/app:ro
      - ../relayer/data:/app/relayer/data
      - /var/run/postgresql:/var/run/postgresql
    expose: ["8787"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      x402:
        aliases: [unsweep-relayer-arb]
networks:
  x402:
    name: x402-netcheck_default
    external: true
